    :root{

    }

      font-size:11px

      border-bottom-color:var(--green)

    .nav-tabs i{

      padding:10px 4px;

    }

    .table tbody td{

      text-align:center;
      padding:9px 4px;
      font-size:13px;
      white-space:nowrap
    }

    .match-cell{

    .badge-ms{
      background:#16a34a;
      border:1px solid #15803d
    }
